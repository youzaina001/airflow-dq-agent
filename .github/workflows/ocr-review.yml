# OpenCodeReview — on-demand AI PR review via OpenRouter.
# Setup and SDLC guidance: docs/ocr-code-review.md
#
# Required secret (Settings -> Secrets and variables -> Actions):
#   OPENROUTER_API_KEY   OpenRouter API key (sk-or-...)
#
# Start a review from Actions -> OpenCodeReview PR Review -> Run workflow
# (PR number + model dropdown), or by commenting /ocreview on a pull request.
# `/ocreview <openrouter-model-id>` uses that model when it is in the dropdown
# (z-ai/glm-5.3-flash, z-ai/glm-5.3-flashx, or deepseek/deepseek-v4.1-flash); otherwise the default
# is z-ai/glm-5.3-flash. Comment runs use reasoning_effort=low. Not a GitHub mention.
#
# Review findings are advisory; installation and execution errors fail the check.

name: OpenCodeReview PR Review

concurrency:
  group: ocr-${{ github.event.inputs.pr_number || github.event.issue.number }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      model:
        description: OpenRouter model
        required: true
        type: choice
        default: z-ai/glm-5.3-flash
        options:
          - z-ai/glm-5.3-flash
          - z-ai/glm-5.3-flashx
          - deepseek/deepseek-v4.1-flash
      reasoning_effort:
        description: GLM/DeepSeek reasoning depth (low is fastest)
        required: true
        type: choice
        default: low
        options:
          - low
          - high
          - max
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && contains(github.event.comment.body, '/ocreview')
      )
    steps:
      - name: Get PR context
        id: pr-context
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = [
              'z-ai/glm-5.3-flash',
              'z-ai/glm-5.3-flashx',
              'deepseek/deepseek-v4.1-flash',
            ];
            const allowedEffort = ['low', 'high', 'max'];
            const defaultModel = 'z-ai/glm-5.3-flash';
            const defaultEffort = 'low';
            let prNumber;
            let model = defaultModel;
            let reasoningEffort = defaultEffort;

            if (context.eventName === 'workflow_dispatch') {
              prNumber = Number(context.payload.inputs.pr_number);
              const chosen = context.payload.inputs.model;
              if (allowed.includes(chosen)) model = chosen;
              const chosenEffort = context.payload.inputs.reasoning_effort;
              if (allowedEffort.includes(chosenEffort)) reasoningEffort = chosenEffort;
            } else {
              const body = context.payload.comment.body || '';
              const mention = body.match(/(^|\s)\/ocreview(?:\s+(\S+))?/i);
              if (!mention) {
                core.setOutput('skip', 'true');
                return;
              }
              prNumber = context.issue.number;
              const token = mention[2] || '';
              if (allowed.includes(token)) model = token;
            }

            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed(`Invalid pull request number: ${prNumber}`);
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('model', model);
            core.setOutput('reasoning_effort', reasoningEffort);
            core.setOutput('skip', 'false');

      - name: Run OpenCodeReview
        if: ${{ steps.pr-context.outputs.skip != 'true' }}
        # Pinned to v1.12.7 (commit 85cecfe) instead of the moving @main ref.
        # ocr_version pins the npm CLI the action installs (default is latest).
        uses: alibaba/open-code-review@85cecfe5f935da2b2aae8f91ce4fee8ed343a681
        env:
          # Disable self-update before installation's first `ocr version` call.
          OCR_NO_UPDATE: '1'
        with:
          ocr_version: '1.12.7'
          llm_url: https://openrouter.ai/api/v1
          llm_auth_token: ${{ secrets.OPENROUTER_API_KEY }}
          llm_model: ${{ steps.pr-context.outputs.model }}
          llm_use_anthropic: 'false'
          # Send no vendor-specific body fields. The action default would add
          # {"thinking":{"type":"disabled"}}, which OpenRouter need not accept.
          llm_extra_body: '{}'
          llm_reasoning_effort: ${{ steps.pr-context.outputs.reasoning_effort }}
          # Per-group deadline. Action default is 15; OpenRouter grouped
          # reviews on this repo exceeded that (8/12 files on PR #80).
          # Keep the job timeout above this value.
          review_task_timeout: '30'
          pr_number: ${{ steps.pr-context.outputs.pr_number }}
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
