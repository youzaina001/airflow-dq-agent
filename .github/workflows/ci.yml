name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests dags examples
          ruff format --check src tests dags examples
      - name: mypy (strict on src/)
        run: mypy src/airflow_dq_agent

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        env:
          LLM_MODE: stub
        run: pytest tests/unit -q --tb=short

  eval:
    # The product. No live key. Stub + recorded-trace fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Eval suite
        env:
          LLM_MODE: stub
          APPLY_MODE: off
        run: pytest tests/evals -q --tb=short
      - name: Demo (suite → stub propose → eval)
        env:
          LLM_MODE: stub
          APPLY_MODE: off
        run: python -m airflow_dq_agent.cli demo --no-db

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration (testcontainers Postgres)
        env:
          LLM_MODE: stub
          APPLY_MODE: off
        run: pytest tests/integration -q --tb=short

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deterministic Compose DAG smoke
        run: make compose-smoke

  compose-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configured CLI and actual Airflow shadow with restricted logins
        run: make compose-shadow

  compose-hitl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Actual Airflow reject, timeout, and crash/retry recovery
        env:
          DQ_HITL_TIMEOUT_SECONDS: "90"
        run: make compose-hitl

  branch-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and eval branch coverage
        env:
          LLM_MODE: stub
          APPLY_MODE: off
        run: pytest tests/unit tests/evals -q --tb=short --cov=airflow_dq_agent --cov-branch --cov-report=json:coverage.json --cov-report=
      - name: Enforce scoped branch floor
        run: python scripts/check_branch_coverage.py coverage.json
      - name: Upload coverage JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error
